<!DOCTYPE html>
<html>
    <head>
        <title>appendChild()</title>
        <script>
            var categories = ["All","Electronics","Fashion","Footwear","Kidswear","Laptops","Mobiles","Clothes"];

            function bodyLoad(){
               var ol =  document.querySelector("ol");

              for(var item  of categories){
                  var li =  document.createElement("li");
                  li.innerHTML = item;

                  ol.appendChild(li);
              }

            }
        </script>
    </head>
    <body onload="bodyLoad()">
        <ol>

        </ol>
    </body>
</html>
